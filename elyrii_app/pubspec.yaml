name: elyrii_app
description: "Compagnon de bien-être Elyrii."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2960.0

  # Network and content encryption
  http: ^1.6.0
  cross_file: ^0.3.5+2
  cryptography: ^2.9.0
  http_parser: ^4.1.2

  # State and navigation
  provider: ^6.1.5+1
  go_router: ^18.0.1

  # Account storage
  shared_preferences: ^2.5.5
  path: ^1.9.1
  sqflite: ^2.4.4
  sqflite_common: ^2.5.13
  flutter_secure_storage: ^10.3.1

  # Dates, animations and mascot rendering
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  flutter_3d_controller: 2.3.0 # MascotModelSurface uses this renderer.
  visibility_detector: ^0.4.0+2
  liquid_glass_widgets: ^1.4.3
  uuid: ^4.5.3

  # Native media, sharing and app information
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  sqflite_common_ffi: ^2.3.6
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/splash_icon.png
    - assets/optimized/mascot.glb
    - assets/optimized/mascot_wardrobe.glb
    - assets/optimized/mascot_poster.png
    - assets/accessory_portraits/
    - assets/brand/logo_monochrome.png
    - assets/brand/navbar_app_icon.png
    - assets/brand/mascot_nav.png
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon_black_bg.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#141314"
  adaptive_icon_foreground: "assets/splash_icon.png"
  adaptive_icon_foreground_inset: 0
