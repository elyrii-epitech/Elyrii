plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // Kotlin is now managed internally by the Flutter Gradle Plugin (Built-in Kotlin).
    id "dev.flutter.flutter-gradle-plugin"
}

// Load keystore properties AFTER plugins block
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.elyrii.elyrii_app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.elyrii.elyrii_app"
        minSdkVersion flutter.minSdkVersion
        targetSdk = 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : null
        }
    }
}

flutter {
    source = "../.."
}

// Distribution builds must never silently use the debug key.
gradle.taskGraph.whenReady { graph ->
    if (!keystorePropertiesFile.exists() && graph.allTasks.any {
        it.project == project && (it.name == 'assembleRelease' || it.name == 'bundleRelease')
    }) {
        throw new GradleException('Release signing requires android/key.properties. Use --debug for technical validation.')
    }
}
