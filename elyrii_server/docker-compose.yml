services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
        - PORT=${PORT:-3000}
        - DB_USER=${DB_USER:-postgres}
        - DB_PASSWORD=${DB_PASSWORD:-postgres}
        - DB_HOST=postgres
        - DB_PORT=5432
        - DB_NAME=${DB_NAME:-elyrii_db}
        - REDPANDA_HOST=${REDPANDA_HOST:-redpanda}
        - REDPANDA_PORT=${REDPANDA_PORT:-9092}
        - SECRET_KEY=${SECRET_KEY:-super-secret-key}
        - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY:-super-refresh-secret-key}
        - NODE_ENV=development
    networks:
      - elyrii_net
    depends_on:
        redpanda:
            condition: service_healthy
        db-migrate:
            condition: service_completed_successfully
    command: ["bun", "run", "start"]


  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    ports:
      - "9092:9092"
      - "9644:9644"
    command: >
      redpanda start
        --overprovisioned
        --smp 1
        --memory 1G
        --reserve-memory 0M
        --check=false
        --node-id=1
        --kafka-addr PLAINTEXT://0.0.0.0:9092
        --advertise-kafka-addr PLAINTEXT://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - elyrii_net

  redpanda_console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda_console
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMIN_URL: http://redpanda:9644
    networks:
      - elyrii_net

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: db-migrations
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-elyrii_db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - elyrii_net

  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-elyrii_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_dbs.sh:/docker-entrypoint-initdb.d/init_dbs.sh:ro
    networks:
      - elyrii_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redpanda_data:
  pg_data:
    name: elyrii_pg_data

networks:
  elyrii_net:
    driver: bridge
