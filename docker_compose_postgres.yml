services:
  db-migrate:
    build:
      context: ./elyrii_server
      dockerfile: Dockerfile
      target: db-migrations
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-elyrii_db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - elyrii_net

  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    container_name: postgres_elyrii
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-elyrii_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./elyrii_server/init_dbs.sh:/docker-entrypoint-initdb.d/init_dbs.sh:ro
    networks:
      - elyrii_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:

networks:
  elyrii_net:
    driver: bridge
