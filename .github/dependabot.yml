version: 2
updates:
  - package-ecosystem: pub
    directory: /elyrii_app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-flutter-updates:
        update-types: [minor, patch]
    ignore:
      # The custom viewer adapter uses package internals; review migrations manually.
      - dependency-name: flutter_3d_controller
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
