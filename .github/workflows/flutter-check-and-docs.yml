# Preserve the name consumed by the existing documentation workflow_run hook.
name: Flutter Style, Test & Docs
on:
  push:
    branches: [main, dev, frontend]
    paths: ['elyrii_app/**', 'docs/mobile/**', 'scripts/flutter_ci_check.sh', '.github/actions/setup-flutter/**', '.github/workflows/flutter-check-and-docs.yml']
  pull_request:
    branches: [main, dev, frontend]
    paths: ['elyrii_app/**', 'docs/mobile/**', 'scripts/flutter_ci_check.sh', '.github/actions/setup-flutter/**', '.github/workflows/flutter-check-and-docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elyrii_app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-flutter
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: dart run tool/check_design_tokens.dart
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --coverage
      - name: Inventory locked dependencies and embedded viewer
        run: |
          flutter pub deps --json > build/pub-deps.json
          python3 tool/frontend_sbom.py --deps build/pub-deps.json --output build/frontend.cdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: frontend-accessibility-and-inventory
          path: |
            elyrii_app/build/a11y-evidence
            elyrii_app/build/frontend.cdx.json
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-coverage
          path: elyrii_app/coverage/lcov.info
  mobile:
    name: Frontend ${{ matrix.target }} technical build
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --debug --no-pub --dart-define=ELYRII_ENV=development
            artifact: elyrii_app/build/app/outputs/flutter-apk/app-debug.apk
          - target: ios-simulator
            os: macos-latest
            command: flutter build ios --simulator --debug --no-pub --dart-define=ELYRII_ENV=development
            artifact: elyrii_app/build/ios/iphonesimulator
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: elyrii_app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-flutter
      - if: matrix.target == 'android'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-${{ matrix.target }}-development-debug
          path: ${{ matrix.artifact }}
  android-smoke:
    name: Frontend Android integration
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: elyrii_app
          script: flutter test integration_test/frontend_flows_test.dart -d emulator-5554 --no-pub --dart-define=ELYRII_ENV=development
  ios-smoke:
    name: Frontend iOS integration
    needs: quality
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      # Pin the host, Xcode and runtime instead of following macos-latest.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    defaults:
      run:
        working-directory: elyrii_app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-flutter
      - name: Build the integration app before booting the simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -version
          flutter build ios --simulator --debug --no-pub --target=integration_test/frontend_flows_test.dart --dart-define=ELYRII_ENV=development --verbose 2>&1 | tee build/ios-integration-build.log
      - name: Select an available iPhone simulator
        run: |
          ELYRII_SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          ELYRII_SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + sys.argv[1].replace(".", "-")
          devices = json.load(sys.stdin)["devices"].get(runtime, [])
          phones = [d for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")]
          phones.sort(key=lambda d: (d["state"] != "Booted", d["name"]))
          if not phones:
              sys.exit(f"No available iPhone simulator for the selected Xcode SDK: {runtime}")
          print(phones[0]["udid"])
          ' "$ELYRII_SIMULATOR_SDK")
          echo "ELYRII_SIMULATOR_ID=$ELYRII_SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Using Xcode simulator SDK $ELYRII_SIMULATOR_SDK, device $ELYRII_SIMULATOR_ID"
          if ! xcrun simctl list devices booted | grep -q "$ELYRII_SIMULATOR_ID"; then
            xcrun simctl boot "$ELYRII_SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$ELYRII_SIMULATOR_ID" -b
      - name: Bootstrap, native persistence and navigation
        timeout-minutes: 15
        run: |
          set -o pipefail
          flutter test integration_test/frontend_flows_test.dart -d "$ELYRII_SIMULATOR_ID" --no-pub --dart-define=ELYRII_ENV=development --verbose 2>&1 | tee build/ios-integration-test.log
      - name: Collect simulator diagnostics
        if: failure() && env.ELYRII_SIMULATOR_ID != ''
        timeout-minutes: 2
        continue-on-error: true
        run: |
          xcrun simctl io "$ELYRII_SIMULATOR_ID" screenshot build/ios-integration-simulator.png
          xcrun simctl spawn "$ELYRII_SIMULATOR_ID" log show --last 10m --style compact --predicate 'process == "Runner"' > build/ios-integration-simulator.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: frontend-ios-integration-logs
          path: elyrii_app/build/ios-integration-*
  dartdoc:
    name: Frontend API documentation
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-flutter
      # SDK-bundled 9.0.6 crashes on CRLF @docImport comments in dependencies.
      - run: dart pub global activate dartdoc 9.0.11
      - run: dart pub global run dartdoc --output doc/api
        working-directory: elyrii_app
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dartdoc-html
          path: elyrii_app/doc/api
