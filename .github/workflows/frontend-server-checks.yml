name: Frontend supporting API checks
on:
  pull_request:
    paths: ['elyrii_server/**', '.github/workflows/frontend-server-checks.yml']
  push:
    branches: [frontend, main, dev]
    paths: ['elyrii_server/**', '.github/workflows/frontend-server-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: elyrii_frontend_test
          POSTGRES_USER: frontend_test
          POSTGRES_PASSWORD: frontend_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: elyrii_frontend_test
      DB_USER: frontend_test
      DB_PASSWORD: frontend_test_only
      FRONTEND_DB_INTEGRATION: '1'
    defaults:
      run:
        working-directory: elyrii_server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.10'
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - name: Prepare disposable schema
        run: bun x drizzle-kit push --force
      - run: bun test
      - name: Validate real HTTP contracts used by mobile
        run: bun run test:mobile
      - run: bun run build
